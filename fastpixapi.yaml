    delete:
      security:
        - BasicAuth: []
      tags:
        - Manage live stream
      summary: Delete a stream
      description: |-
        Permanently removes a specified live stream from the workspace. If the stream is still active, the encoder will be disconnected, and the ingestion will stop. This action cannot be undone, and any future playback attempts will fail. 

          By providing the `streamId`, the API will terminate any active connections to the stream and remove it from the list of available live streams. You can further look for <a href="https://fastpix.com/docs/live-stream-events/live-events#videolive_streamdeleted">video.live_stream.deleted</a> webhook to notify your system about the status. 

          #### Example
        
          For an online concert platform, a trial stream was mistakenly made public. The event manager deletes the stream before the concert begins to avoid confusion among viewers. 
        
        
          Related guide: <a href="https://fastpix.com/docs/manage-live-streams/create-and-manage-live-streams">Manage streams</a>
      operationId: delete-live-stream
      parameters:
        - name: streamId
          in: path
          required: true
          example: 8717422d89288ad5958d4a86e9afe2a2
          description: Upon creating a new live stream, FastPix assigns a unique identifier to the stream.
          schema:
            type: string
      responses:
        '200':
          description: Stream deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStreamDeleteResponse'
        '401':
          description: Unauthorized
          content:
