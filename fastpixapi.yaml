  /iam/signing-keys:
    post:
      tags:
        - Signing keys
      summary: Create a signing key
      operationId: create_signing_key
      description: |-
        This endpoint allows you to create a new signing key pair for FastPix. When you call this endpoint, the API generates a 2048-bit RSA key pair. The privateKey will be returned in the response, encoded in Base64 format, and you will receive a unique key id to reference the key in future operations. FastPix will securely store the public key to validate signed tokens. 


        <h4>Instructions</h4> 
        
        
        **Private key handling:** The privateKey you receive is encoded in Base64. To use it, you'll need to decode it using Base64 decoding. Make sure to store this private key securely, as it is required for signing tokens. 
        
        
        **Key-ID:** The id will be used to reference this specific key pair in future API requests or configurations. 
        
        
        Once the key pair is generated, the private key must be securely stored by the developer, as FastPix will not save it. The public key will be used by FastPix to verify any signed tokens, ensuring that the client interacting with the system is legitimate. 
        
        
        
        
        
        <h4>Use case scenario</h4> 
        
        
        
        **Use case:** A developer building a video subscription service wants to ensure that only authorized users can access premium content. By generating a signing key, the developer can issue signed JSON Web Tokens (JWTs) to authenticate and authorize users. These tokens can be validated by FastPix using the stored public key. 
        
        
        **Detailed example:**  Imagine a scenario where you're building a video-on-demand platform that restricts access based on user subscriptions. To ensure only subscribed users can stream content, you generate a signing key using this API. Each time a user logs in, you create a JWT signed with the private key. When the user attempts to play a video, FastPix uses the public key to verify the token and confirms that the user is authorized.
      security:
        - BasicAuth: []
      responses:
        '201':
          description: created a signing key successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
              example:
                success: true
                data:
                  id: fc9d9368-6ee5-4b16-ae50-880a2374bdc4
                  privateKey: 
                  createdAt: '2024-01-11T10:00:06.618993Z'
        '401':
          description: response for unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnAuthorizedResponse'
              example:
                success: false
                error:
                  code: 401
                  message: unauthorized
        '403':
          description: response for forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
              example:
                success: false
                error:
                  code: 403
                  message: forbidden
    get:
      tags:
        - Signing keys
      summary: Get list of signing key
      operationId: list_signing_keys
      description: |-
        This endpoint returns a list of all the signing keys associated with an organization in FastPix. Each key entry in the response includes metadata such as the key id, creation date, and workspace details. This helps you manage multiple keys, track their usage, and identify which keys are valid for signing API requests. 




        <h4>How it works</h4> 
        
        
        The API returns the list in a paginated format, allowing you to audit and track all keys used for your application. Regularly reviewing this list is essential for ensuring that old or compromised keys are promptly revoked and that new keys are properly integrated into workflows. 
        
        
        
        
        <h4>Use case scenario</h4> 
        
        
        
        **Use case:** A security-conscious development team wants to ensure they follow a key rotation policy, rotating signing keys every few months. By retrieving the list of signing keys, they can identify which keys are still in use and which ones need to be rotated. 
        
        
        **Detailed example:**  You're managing a multi-region video platform where different teams in different regions have created their own signing keys. To ensure compliance with your organization's security policies, you regularly review the list of signing keys to verify which ones are still active. You find a few keys that haven’t been used in months, and based on the creation date, you decide to rotate them.
      security:
        - BasicAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 10
            example: 25
          description: Limit specifies the maximum number of items to display per page.
        - in: query
          name: offset
          schema:
            type: number
            minimum: 1
            default: 1
            example: 1
          description: 'It is used for pagination, indicating the starting point for fetching data.  '
      responses:
        '200':
          description: successfully fetched all signing keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getAllSigningKeyResponse'
              example:
                success: true
                data:
                  - id: fc9d9368-6ee5-4b16-ae50-880a2374bdc4
                    createdAt: '2024-01-11T10:00:06.618993Z'
                    workspace:
                      - id: 6fa85f64-5717-4562-b3fc-2c963f66ag5t
                        name: environment1
                        workspaceType: production
                    pagination:
                      totalRecords: 100
                      currentOffset: 1
                      offsetCount: 10
        '401':
          description: response for unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnAuthorizedResponse'
              example:
                success: false
                error:
                  code: 401
                  message: unauthorized
        '403':
          description: response for forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
              example:
                success: false
                error:
                  code: 403
                  message: forbidden
        '422':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                error:
                  code: 422
                  message: payload validation failed
                  fields:
                    - field: fieldName
                      message: must not be null
  /iam/signing-keys/{signingKeyId}:
    delete:
      tags:
        - Signing keys
      summary: Delete a signing key
      operationId: delete_signing_key
      description: |-
        This endpoint allows you to delete an existing signing key, and the action is permanent. Once a key is deleted, any signatures or tokens generated using that key will immediately become invalid. This means you can no longer use the key to sign JSON Web Tokens (JWTs) or authenticate API requests. 
        <h4>Usage</h4> 
        To delete a signing key, you will need to provide the unique key id that was obtained when creating the signing key. This key id serves as the identifier for the specific signing key you want to remove from your account. 
        
        
        
        <h4>How it works</h4> 

        By specifying the key id, the API removes the signing key from the system. After the key is deleted, any API requests or tokens that rely on it will fail. This action is useful when a key is compromised or when rotating keys as part of security policies. 
        
        
        
        <h4>Use case scenario</h4> 
        
        
        **Use case:** A key used by an outdated application version has been compromised, or a developer accidentally leaked it. To prevent unauthorized access, the developer deletes the signing key, revoking its ability to sign requests immediately. 
        
        
        **Detailed example:**  Let’s say you have a signing key used for a specific version of your mobile app, and you discover that this key has been compromised due to a security breach. To mitigate the issue, you delete the key to invalidate any tokens generated using it. As soon as the key is deleted, users on the compromised version of the app can no longer make valid requests, thus preventing further exploitation.
      security:
        - BasicAuth: []
      parameters:
        - name: signingKeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 3ta85f64-5717-4562-b3fc-2c963f66afa6
          description: When creating the signing key, FastPix assigns a universally unique identifier with a maximum length of 255 characters.
      responses:
        '200':
          description: successfully fetched all signing keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSigningKeyResponse'
        '401':
          description: response for unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnAuthorizedResponse'
              example:
                success: false
                error:
                  code: 401
                  message: unauthorized
        '403':
          description: response for forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
              example:
                success: false
                error:
                  code: 403
                  message: forbidden
        '404':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyNotFoundError'
        '422':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                error:
                  code: 422
                  message: payload validation failed
                  fields:
                    - field: fieldName
                      message: must not be null
    get:
      tags:
        - Signing keys
      summary: Get signing key by ID
      operationId: get-signing_key_by_id
      description: |-
        This endpoint allows you to retrieve detailed information about a specific signing key using its unique key id. While the private key is not returned for security reasons, you'll be able to see the key's creation date, status, and other associated metadata. This endpoint also returns the workspaceId and publicKey in the response. 


        <h4>Usage: Generating a JWT token</h4> 

        In the response, you will receive the workspaceId and publicKey associated with the signing key. With the publicKey and the privateKey obtained from the "Create a Signing Key" endpoint, you can generate a JSON Web Token (JWT) using the RS256 algorithm. This token can be utilized for accessing private media assets, GIFs, thumbnails, and spritesheets. 
        
        
        
        <h4>Payload:</h4> 
        
        
        ```
        { 
          "kid": "359302ee-2446-4afe-9348-8b4656b9ddb1", 
          "aud": "media:6cee6f85-9334-4a51-9ce3-e0241d94ceef", 
          "iss": "fastpix.com", 
          "sub": "", 
          "iat": 1706703204, 
          "exp": 1735626783 

        } 
        ```
        
        
        
        * **kid:** The key ID of the signing key. 
        * **aud:** The audience for which the token is intended. 
        * **iss:** The issuer of the token (e.g., "fastpix.com"). 
        * **sub:** The subject of the token, typically representing the user or entity the token is issued for. In this case, use the workspaceId fetched from the "Get Signing Key by ID" endpoint. 
        * **groups:** An array of groups the subject belongs to (e.g., ["user"]). 
        * **iat:** The issued-at timestamp, indicating when the token was created. 
        * **exp:** The expiration timestamp, indicating when the token will no longer be valid. 
        
        
        
        
        
        <h4>Use case scenario</h4> 
        
        
        
        **Use case:** A developer is unsure about the status of a signing key they created months ago and wants to verify whether it's still in use or has expired. 
        
        
        
        **Detailed example:**  You’re working on a streaming platform and realize you haven’t checked the status of a signing key that was used for playback access several months ago. By fetching the key details using its ID, you can confirm whether it’s still active, when it was created, and if it’s nearing expiration. This allows you to plan a rotation or deactivation if needed.
      security:
        - BasicAuth: []
      parameters:
        - name: signingKeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 5ta85f64-5717-4562-b3fc-2c963f66afa6
          description: 'When creating the signing key, FastPix assigns a universally unique identifier with a maximum length of 255 characters. '
      responses:
        '200':
          description: successfully fetched signing key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getPublicPemUsingSigningKeyIdResponseDTO'
        '401':
          description: response for unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnAuthorizedResponse'
              example:
                success: false
                error:
                  code: 401
                  message: unauthorized
        '403':
          description: response for forbidden request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
              example:
                success: false
                error:
                  code: 403
                  message: forbidden
        '404':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyNotFoundError'
        '422':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /data/viewlist:
    get:
      security:
        - BasicAuth: []
      tags:
        - Views
      summary: List video views
      operationId: list_video_views
      description: |-
        Retrieves a list of video views that fall within the specified filters and have been completed within a defined timespan. It allows you to analyse viewer interactions with your video content effectively. 


        #### How it works

          1. Make a `GET` request to this endpoint with the desired query parameters. 

          2. Specify the timespan for which you want to retrieve the video views using the `timespan[]` parameter. 

          3. Filter the views based on dimensions such as browser, device, video title, viewer ID, etc., using the `filterby[]` parameter. Get the dimensions by calling <a href="https://fastpix.com/docs/video-data-api/dimensions/list-dimensions">list the dimensions</a> endpoint. 

          4. Paginate the results using the `limit` and `offset` parameters. 

          5. Optionally, filter by `viewerId`, `errorCode`, `orderBy` a specific field, and sort in ascending or descending order. 

          6. Receive a response containing the list of video views matching the specified criteria.

        Each view in the response will include a unique `viewId`. You can use this `viewId` to call the <a href="https://fastpix.com/docs/video-data-api/views/get-video-view-details">get details of video view</a> endpoint to retrieve more detailed information about that specific view. 


        #### Example

        Suppose you're managing a video streaming service and need to analyze how the content performs across different devices and browsers. By calling the List Video Views endpoint with filters like `browser_name` and `device_type`, you can get insights into which platforms are most popular with the audience. This data will help you optimize content for the most-used platforms and troubleshoot any playback issues on less common devices.


          Related guide: <a href="https://fastpix.com/docs/concepts/audience-metrics">Audience metrics</a>, <a href="https://fastpix.com/docs/working-with-video-data/explore-the-dashboard#1-views-dashboard">Views dashboard</a>
      parameters:
        - in: query
          name: timespan[]
          description: |
            This parameter specifies the time span between which the video views list should be retrieved by. You can provide either from and to unix epoch timestamps or time duration. The scope of duration is between 60 minutes to 30 days.
          style: form
          explode: true
          required: true
          schema:
            type: string
            example: 7:days
            enum:
              - 60:minutes
              - 6:hours
              - 24:hours
              - 3:days
              - 7:days
              - 30:days
        - in: query
          name: filterby[]
          description: |
            Pass the dimensions and their corresponding values you want to filter the views by. For excluding the values in the filter we can pass '!' before the filter value. The list of filters can be obtained from list of dimensions endpoint.
            Example Values : [ browser_name:Chrome , os_name:macOS , device_name:Galaxy ]
          style: form
          explode: true
          schema:
            type: string
            example: browser_name:Chrome
        - in: query
          name: limit
          description: |
            Pass the limit to display only the rows specified by the value.
          schema:
            type: integer
            example: 10
            default: 10
        - in: query
          name: offset
          description: |
            Pass the offset value to indicate the page number.
          schema:
            type: integer
            example: 1
            default: 1
        - in: query
          name: viewerId
          description: |
            Pass the viewer_id to filter the list of views. This value can be manually set during integration or generated by FastPix. When set manually it can be a string of aplha numeric values of any length.
          schema:
            type: string
            example: 09a78f7d-02ee-44f5-aa39-1b268ed2c270
        - in: query
          name: errorCode
          description: |
            Pass the error code to filter the list of views. The possible values of error code can be fetched from list of errors end point.
          schema:
            oneOf:
              - type: string
              - type: integer
            nullable: true
            example: 1002
        - in: query
          name: orderBy
          description: |
            Pass this value to sort the view list by.
          schema:
            type: string
            example: view_end
            default: view_end
        - in: query
          name: sortOrder
          description: |
            The order direction to sort the view list by.
          schema:
            type: string
            example: asc
            default: asc
      responses:
        '200':
          description: Get the list of Views
          content:
            application/json:
              schema:
                example:
                  success: true
                  data:
                    - viewId: 92752c49-1bce-4cf8-bea4-5c2c2ac7575d
