  /on-demand/{mediaId}/update-mp4Support:
    patch:
      security:
        - BasicAuth: []
      tags:
        - Manage videos
      summary: Update the mp4Support of a media by ID
      description: |
        This endpoint allows you to update the `mp4Support` setting of an existing media file using its media ID. You can specify the MP4 support level, such as `none`, `capped_4k`, `audioOnly`, or a combination of `audioOnly`, `capped_4k`, in the request payload.

        #### How it works

        1. Send a PATCH request to this endpoint, replacing `{mediaId}` with the media ID.

        2. Provide the desired `mp4Support` value in the request body.

        3. Receive a response confirming the update, including the media's updated MP4 support status.

        #### MP4 Support Options

        - `none` – MP4 support is disabled for this media.

        - `capped_4k` – The media will have mp4 renditions up to 4K resolution.

        - `audioOnly` – The media will generate an m4a file containing only the audio track.

        - `audioOnly,capped_4k` – The media will have both an audio-only m4a file and mp4 renditions up to 4K resolution.

        #### Webhook events

        - <a href="https://fastpix.com/docs/vod-events/transform-media-events#videomediamp4supportready">video.media.mp4Support.ready</a> – Triggered when the MP4 support setting is successfully updated.

        #### Example
        Suppose you have a video uploaded to the FastPix platform, and you want to allow users to download the video in MP4 format. By setting "mp4Support": "capped_4k", the system will generate an MP4 rendition of the video up to 4K resolution, making it available for download via the stream URL(`https://stream.fastpix.com/{playbackId}/{capped-4k.mp4 | audio.m4a}`).
        If you want users to stream only the audio from the media file, you can set "mp4Support": "audioOnly". This will provide an audio-only stream URL that allows users to listen to the media without video.
        By setting "mp4Support": "audioOnly,capped_4k", both options will be enabled. Users will be able to download the MP4 video and also stream just the audio version of the media.


        Related guide: <a href="https://fastpix.com/docs/playback-and-delivery/enable-mp4-support-for-offline-viewing">Use MP4 support for offline viewing</a>
      operationId: updated-mp4Support
      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: string
            format: uuid
            example: 4fa85f64-5717-4562-b3fc-2c963f66afa6
          description: |
            When creating the media, FastPix assigns a universally unique identifier with a maximum length of 255 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mp4Support:
                  type: string
                  example: capped_4k
                  enum:
                    - none
                    - capped_4k
                    - audioOnly
                    - audioOnly,capped_4k
                  description: "Determines the type of MP4 support for the media.   - **none**: Disables MP4 support.   - **capped_4k**: Enables MP4 downloads with resolutions up to 4K.   - **audioOnly**: Provides an MP4 stream containing only the audio.   - **audioOnly,capped_4k**: Enables both MP4 video downloads (up to 4K) and an audio-only stream.  "
              example:
                mp4Support: capped_4k
      responses:
        "200":
          description: Media details updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Demonstrates whether the request is successful or not.
                  data:
                    $ref: "#/components/schemas/Media"
                example:
                  success: true
                  data:
                    thumbnail: https://venus-images.fastpix.dev/cf41c9f7-ece3-4efe-8d31-c6e000dc422b/thumbnail.png
                    id: eb56a668-0354-40c2-9233-f3197e1baabd
                    workspaceId: c788be40-91a5-4d2d-abf7-47398a6276a1
                    metadata:
                      key1: value1
                    maxResolution: 1080p
                    sourceResolution: 1080p
                    status: ready
                    mp4Support:
                      - type: capped_4k
                        status: ready
                        height: 1080
                        width: 1920
                        ext: mp4
                      - type: audioOnly
                        status: ready
                        ext: m4a
                    sourceAccess: true
                    playbackIds:
                      - id: cf41c9f7-ece3-4efe-8d31-c6e000dc422b
                        accessPolicy: public
                        accessRestrictions:
                          domains:
                            defaultPolicy: allow
                            allow: []
                            deny: []
                          userAgents:
                            defaultPolicy: allow
                            allow: []
                            deny: []
                    tracks:
                      - id: 344fd5bc-82af-4d11-bc1c-785d9e6f9aef
                        type: video
                        width: 1920
                        height: 1080
                        frameRate: 30/1
                        closedCaptions: false
                    duration: "00:00:10"
                    frameRate: 30/1
                    aspectRatio: "16:9"
                    createdAt: "2024-12-06T03:47:26.489888Z"
                    updatedAt: "2024-12-06T03:47:47.593400Z"
        "400":
          description: Mp4Support value already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateMp4Support"
        "401":
          description: Unauthorized
          content:
