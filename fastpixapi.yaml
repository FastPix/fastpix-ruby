    ViewNotFound:
      type: object
      properties:
        success:
          description: It demonstrates whether the request is successful or not.
          type: boolean
          example: false
        error:
          description: Returns the problem that has occured
          type: object
          properties:
            code:
              description: An error code indicating the type of the error.
              type: number
              example: 404
