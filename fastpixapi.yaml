  /live/streams/{streamId}/live-enable:
    put:
      security:
        - BasicAuth: []
      tags:
        - Manage live stream
      summary: Enable a stream
      description: |-
        This endpoint allows you to enable a livestream by transitioning its status from `disabled` to `idle`. Once enabled, the stream becomes available and ready to accept an incoming broadcast from a streaming tool.
        
        Streams on the trial plan cannot be re-enabled if they are in the `disabled` state.
        
        The `livestreamId` must be provided in the path, and the stream must not already be in an enabled state (`idle`, `preparing`, or `active`).
        
        #### Example
        
        A creator disables a livestream to pause it temporarily. Later, they decide to continue the session. By calling this endpoint with the stream's ID, they can re-enable and restart the same livestream.
        
        Related guide <a href="https://fastpix.com/docs/manage-live-streams/create-and-manage-live-streams">Manage streams</a>
      operationId: enable-live-stream
      parameters:
        - name: streamId
          in: path
          required: true
          example: 91a264dcc447b63da6fb79ef925cd76d
          description: Upon creating a new live stream, FastPix assigns a unique identifier to the stream.
          schema:
            type: string
      responses:
        '200':
          description: Stream details updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStreamDeleteResponse'
        '400':
          description: Bad Request – Stream is either already enabled or cannot be enabled on trial plan.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TrialPlanRestrictionError'
                  - $ref: '#/components/schemas/StreamAlreadyEnabledError'
              examples:
                trialPlanError:
                  summary: Trial plan restriction
                  value:
                    success: false
                    error:
                      code: 400
                      message: stream cannot be enabled on trial plan
                      description: The requested stream cannot be enabled while on a trial plan. Please upgrade your plan.
                streamAlreadyEnabled:
                  summary: Stream already enabled
                  value:
                    success: false
                    error:
                      code: 400
                      message: stream is already enabled
                      description: The requested stream is already in an enabled state.

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidPermission'
        '404':
          description: Stream Not Found
          content:
            application/json:
