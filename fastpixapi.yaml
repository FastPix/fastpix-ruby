              workspaceId:
                type: string
                format: uuid
                example: a56a1e42-65ec-4f9d-9fc1-89d24cd59348
                description: The unique identifier for the workspace associated with the media.
              metadata:
                type: object
                additionalProperties:
                  type: string
                  maxLength: 255
                maxProperties: 10
                example:
                  key1: value1
                description: 'Tag a video in "key" : "value" pairs for searchable metadata. Maximum 10 entries, 255 characters each.'
              maxResolution:
                type: string
                example: 480p
                enum:
                  - 2160p
                  - 1440p
                  - 1080p
                  - 720p
                  - 480p
                  - 360p
                description: The maximum resolution specified for the media.
              sourceResolution:
                type: string
