  /on-demand/{mediaId}/playback-ids:
    post:
      security:
        - BasicAuth: []
      tags:
        - Playback
      summary: Create a playback ID
      description: |
        You can create a new playback ID for a specific media asset. If you have already retrieved an existing `playbackId` using the <a href="https://fastpix.com/docs/video-on-demand-api/manage-videos/get-media">Get Media by ID</a> endpoint for a media asset, you can use this endpoint to generate a new playback ID with a specified access policy. 



        If you want to create a private playback ID for a media asset that already has a public playback ID, this endpoint also allows you to do so by specifying the desired access policy. 

        #### How it works

        1. Make a `POST` request to this endpoint, replacing `<mediaId>` with the `uploadId` or `id` of the media asset. 

        2. Include the `accessPolicy` in the request body with `private` or `public` as the value. 

        3. Receive a response containing the newly created playback ID with the requested access level. 


        #### Example
        A video streaming service generates playback IDs for each media file when users request to view specific content. The playback ID is then used by the video player to stream the video.
      operationId: create-media-playback-id
      parameters:
        - in: path
          name: mediaId
          required: true
          description: When creating the media, FastPix assigns a universally unique identifier with a maximum length of 255 characters.
          schema:
            type: string
            format: uuid
            example: dbb8a39a-e4a5-4120-9f22-22f603f1446e
            description: When creating the media, FastPix assigns a universally unique identifier with a maximum length of 255 characters.
      requestBody:
        description: Request body for creating playback id for an media
        content:
          application/json:
            schema:
              type: object
              required:
                - accessPolicy
              properties:
                accessPolicy:
                  $ref: "#/components/schemas/AccessPolicy"
                accessRestrictions:
                  type: object
                  properties:
                    domains:
                      $ref: "#/components/schemas/DomainRestrictions"
                    userAgents:
                      $ref: "#/components/schemas/UserAgentRestrictions"
                drmConfigurationId:
                  type: string
                  format: uuid
                  description: DRM configuration ID (required if accessPolicy is 'drm')
                  example: 123e4567-e89b-12d3-a456-426614174000
                resolution:
                  type: string
                  enum:
                    - 480p
                    - 720p
                    - 1080p
                    - 1440p
                    - 2160p
                  description: The maximum resolution for the playback ID.
                  example: 1080p
      responses:
        "201":
          description: Playback id for an media
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Demonstrates whether the request is successful or not.
                  data:
                    description: Displays the result of the request.
                    type: object
                    properties:
                      playbackIds:
                        type: array
                        items:
                          $ref: "#/components/schemas/PlaybackId"
                        description: A collection of Playback ID objects utilized for crafting HLS playback URLs.
                example:
                  success: true
                  data:
                    id: b331e0d8-bef4-4ad2-8760-757fdb2818b7
                    accessPolicy: public
                    accessRestrictions:
                      domains:
                        defaultPolicy: allow
                        allow: []
                        deny: []
                      userAgents:
                        defaultPolicy: allow
                        allow: []
                        deny: []
                    resolution: 1080p
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPermission"
