                  - 2160p
                  - "2160"
                  - 1440p
                  - "1440"
                  - 1080p
                  - "1080"
                  - 720p
                  - "720"
                  - 480p
                  - "480"
                  - 360p
                  - "360"
                description: The actual resolution of the uploaded media.
              status:
                type: string
                example: Ready
                enum:
                  - preparing
                  - ready
                  - failed
                  - created
                description: The current processing status of the media.
              sourceAccess:
                type: boolean
                example: false
                description: Indicates whether the original media file is accessible.
              playbackIds:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: 66dc7b0b-9dfb-4721-a738-837f89ccbd0a
                      description: The unique identifier for playback.
                    accessPolicy:
                      type: string
                      example: public
                      description: The access policy of the playback.
                    accessRestrictions:
                      type: object
                      properties:
                        domains:
                          type: object
                          properties:
                            defaultPolicy:
                              type: string
                              example: allow
                            allow:
                              type: array
                              items:
                                type: string
                              example: []
                            deny:
                              type: array
                              items:
                                type: string
                              example: []
                        userAgents:
                          type: object
                          properties:
                            defaultPolicy:
                              type: string
                              example: allow
                            allow:
                              type: array
                              items:
                                type: string
                              example: []
                            deny:
                              type: array
                              items:
                                type: string
                              example: []
              tracks:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: a0dd6283-001a-41eb-91ed-851de81e9714
                      description: The unique identifier for the media track.
                    type:
                      type: string
                      example: video
                      enum:
                        - video
                        - audio
                        - subtitle
                      description: The type of media track.
                    width:
                      type: integer
                      example: 640
                      description: The width of the video track (applicable to video only).
                    height:
                      type: integer
                      example: 360
                      description: The height of the video track (applicable to video only).
                    status:
                      type: string
                      example: Ready
                      description: The current processing status of the track.
                    languageCode:
                      type: string
                      pattern: ^(ar(-SA)?|bn(-BD|-IN)?|ca(-ES)?|cs(-CZ)?|da(-DK)?|de(-AT|-CH|-DE)?|el(-GR)?|en(-AU|-CA|-GB|-IE|-IN|-NZ|-US|-ZA)?|es(-AR|-CL|-CO|-ES|-MX|-US)?|fi(-FI)?|fr(-BE|-CA|-CH|-FR)?|he(-IL)?|hi(-IN)?|hr(-HR)?|hu(-HU)?|id(-ID)?|it(-CH|-IT)?|ja(-JP)?|ko(-KR)?|nl(-BE|-NL)?|no(-NO)?|pl(-PL)?|pt(-BR|-PT)?|ro(-RO)?|ru(-RU)?|sk(-SK)?|sv(-SE)?|ta(-IN|-LK)?|th(-TH)?|tr(-TR)?|uk(-UA)?|bg(-BG)?|zh(-CN|-HK|-TW)?)$
                      example: und
                      description: The language code of the audio or subtitle track.
                    languageName:
                      type: string
                      minLength: 1
                      pattern: "^[^\\s]+$"
                      example: default
                      description: The language name of the audio or subtitle track.
              generatedSubtitles:
                type: array
                items:
                  type: object
                description: Generated subtitle tracks associated with the media.
              isAudioOnly:
                type: boolean
                example: false
                description: Indicates whether the media contains only audio.
              subtitleAvailable:
                type: boolean
                example: false
                description: Indicates whether subtitles are available for the media.
              duration:
                type: string
                example: "00:00:20"
                description: The total duration of the media.
              aspectRatio:
                type: string
                example: "16:9"
                description: The aspect ratio of the media.
              createdAt:
                type: string
                format: date-time
                example: "2025-03-12T06:17:26.403017Z"
                description: Timestamp of when the media was created.
              updatedAt:
                type: string
                format: date-time
                example: "2025-03-12T06:17:41.863577Z"
                description: Timestamp of when the media was last updated.
        pagination:
          type: object
          properties:
            totalRecords:
              type: integer
              example: 4
              description: Total number of records available.
            currentOffset:
              type: integer
              example: 1
              description: The starting offset of the current result set.
            offsetCount:
              type: integer
              example: 4
              description: The number of items returned in the current response.
    Media:
      type: object
      properties:
        thumbnail:
          type: string
          example: https://images.fastpix.com/6b13fdaf-f9ac-4970-a13b-01ea417e8783/thumbnail.png
          description: A video thumbnail is a still image that acts as the preview image for your video.
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          description: When creating the media, FastPix assigns a universally unique identifier with a maximum length of 255 characters.
        workspaceId:
          type: string
          format: uuid
          example: 5ta85f64-5717-4562-b3fc-2c963f66afa6
          description: A unique identifier is generated by FastPix for the workspace.
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 255
          maxProperties: 10
          example:
            key1: value1
          description: 'You can search for videos with specific key value pairs using metadata, when you tag a video in "key" : "value" pairs. Dynamic Metadata allows you to define a key that allows any value pair. You can have maximum of 255 characters and upto 10 entries are allowed.'
        maxResolution:
          type: string
          example: 1080p
          default: 1080p
          enum:
            - 2160p
            - 1440p
            - 1080p
            - 720p
            - 480p
            - 360p
          description: The maximum resolution specified by the user for the media.
        sourceResolution:
          type: string
          example: 1080p
          default: 1080p
          enum:
            - 2160p
            - "2160"
            - 1440p
            - "1440"
            - 1080p
            - "1080"
            - 720p
            - "720"
            - 480p
            - "480"
            - 360p
            - "360"
          description: The actual resolution of the uploaded media. This represents the native quality of the source media.
        status:
          type: string
          example: preparing
          description: Determines the media's status, which can be one of the possible values.
        mp4Support:
          type: array
          nullable: true
          items:
            type: object
            properties:
              type:
                type: string
                example: capped_4k
                enum:
                  - capped_4k
                  - audioOnly
                description: The MP4 rendition type. `capped_4k` is a downloadable MP4 video capped at 4K resolution, `audioOnly` is a downloadable m4a audio-only file.
              status:
                type: string
                example: ready
                enum:
                  - preparing
                  - ready
                  - failed
                description: Generation status of this MP4 rendition.
              height:
                type: integer
                nullable: true
                example: 1080
                description: Pixel height of the rendition. Omitted for the `audioOnly` type.
              width:
                type: integer
                nullable: true
                example: 1920
                description: Pixel width of the rendition. Omitted for the `audioOnly` type.
              ext:
                type: string
                example: mp4
                enum:
                  - mp4
                  - m4a
                description: File extension of the downloadable rendition.
          example:
            - type: capped_4k
              status: ready
              height: 1080
              width: 1920
              ext: mp4
            - type: audioOnly
              status: ready
              ext: m4a
          description: |
            A list of MP4 renditions generated for the media when MP4 support is requested. Each entry represents one downloadable rendition (for example, a capped-4K video file or an audio-only m4a file) along with its generation status. Omitted when no MP4 support has been requested.
        sourceAccess:
          type: boolean
          example: true
          description: The sourceAccess parameter determines whether the original media file is accessible. Set to true to enable access or false to restrict it
        playbackIds:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackId"
          description: A collection of Playback ID objects utilized for crafting HLS playback URLs.
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
          description: A media consists of different media tracks, like video, audio, and subtitle, all combined.
        duration:
          type: string
          example: "00:00:10"
          description: The time span of the media, measured in seconds with a maximum allowable duration of 12 hours per individual media.
        frameRate:
          type: string
          example: 30/1
          description: Frame rate quantifies the speed at which frames are displayed per second. It represents the range of frames available for a specific track. If the frame rate of the input file is indeterminable, it will be indicated by a value of -1.
        optimizeAudio:
          type: boolean
          nullable: true
          example: false
          description: |
            Indicates whether the quality and volume of the audio track were enhanced during processing. This is available for pre-recorded content only.
        aspectRatio:
          type: string
          example: "16:9"
          description: The aspect ratio of a video is a value that describes the relative shape of a video based on its width and height.
        createdAt:
          type: string
          format: date-time
          example: "2023-10-20T10:50:34.594302Z"
          description: Time the media was created, defined as a localDateTime (UTC Time).
        updatedAt:
          type: string
          format: date-time
          example: "2023-10-20T10:50:34.594302Z"
          description: Time the media was updated, defined as a localDateTime (UTC Time).
    Track:
      type: object
      description: A media consists of different media tracks, like video, audio, and subtitle, all combined.
      required:
        - type
      properties:
        id:
          type: string
          format: uuid
          example: 9oa85f64-5717-4562-b3fc-2c963f66afa6
          description: FastPix generates a unique identifier for each track.
        type:
          type: string
          example:
            availableValue: video
            possibleValue: video, audio, subtitle
          description: Defines the type of input. This option is mandatory.
        width:
          type: number
          example: 1920
          description: Track width denotes the range of widths applicable to a specific track. Currently, this setting can be modified only for video tracks
        height:
          type: number
          example: 1080
          description: Track height denotes the range of height applicable to a specific track. Currently, this setting can be modified only for video tracks.
        frameRate:
          type: string
          example: 30/1
          description: Frame rate quantifies the speed at which frames are displayed per second. It represents the range of frames available for a specific track. If the frame rate of the input file is indeterminable, it will be indicated by a value of -1.
        closedCaptions:
          type: boolean
          example: false
          description: Indicates if the track contains closed captions.
      example:
        tracks:
          - id: 9oa85f64-5717-4562-b3fc-2c963f66afa6
            type: video
            width: 1920
            height: 1080
            frameRate: 30/1
            closedCaptions: false
    PlaybackId:
      type: object
      description: A collection of Playback ID objects utilized for crafting HLS playback urls.
      properties:
        id:
          type: string
          format: uuid
          example: 6ta85f64-5717-4562-b3fc-2c963f66afa6
          description: A unique identifier is generated by FastPix for the playbacks.
        accessPolicy:
          $ref: "#/components/schemas/AccessPolicy"
        accessRestrictions:
          type: object
          description: Controls access based on domains and user agents. Defines a default policy (either "allow" or "deny") and provides lists for explicitly allowed or denied domains and user agents.
          properties:
            domains:
              type: object
              description: Restrictions based on the originating domain of a request (e.g., whether requests from certain websites should be allowed or blocked).
              properties:
                defaultPolicy:
                  $ref: "#/components/schemas/PolicyAction"
                allow:
                  type: array
                  items:
                    type: string
                  description: A list of domains that are explicitly allowed access.
                deny:
                  type: array
                  items:
                    type: string
                  description: A list of domains that are explicitly blocked from accessing the resource.
            userAgents:
              type: object
              description: Restrictions based on the user agent (which is typically a string sent by browsers or bots identifying themselves).
              properties:
                defaultPolicy:
                  $ref: "#/components/schemas/PolicyAction"
                allow:
                  type: array
                  items:
                    type: string
                  description: A list of specific user agents that are allowed to access the resource.
                deny:
                  type: array
                  items:
                    type: string
                  description: A list of specific user agents that are blocked.
    SummaryResponse:
      properties:
        mediaId:
          type: string
          format: uuid
          example: c695988b-ff84-42ae-bb21-10f284fedb0e
        isGeneratedSummary:
          type: boolean
          example: true
    ChaptersResponse:
      properties:
        mediaId:
          type: string
          format: uuid
          example: c695988b-ff84-42ae-bb21-10f284fedb0e
        isGeneratedChapters:
          type: boolean
          example: true
    NamedEntitiesResponse:
      properties:
        mediaId:
          type: string
          format: uuid
          example: c695988b-ff84-42ae-bb21-10f284fedb0e
        isGeneratedNamedEntities:
          type: boolean
          example: true
    ModerationResponse:
      properties:
        mediaId:
          type: string
          format: uuid
          example: c695988b-ff84-42ae-bb21-10f284fedb0e
        isModerationEnabled:
          type: boolean
          example: true
    CreateMediaRequest:
      required:
        - accessPolicy
        - inputs
      properties:
        inputs:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/VideoInput"
              - $ref: "#/components/schemas/WatermarkInput"
              - $ref: "#/components/schemas/AudioInput"
              - $ref: "#/components/schemas/SubtitleInput"
        metadata:
          type: object
          additionalProperties:
            type: string
            maxLength: 255
          maxProperties: 10
          example:
            key1: value1
          description: 'You can search for videos with specific key value pairs using metadata, when you tag a video in "key" : "value" pairs. Dynamic Metadata allows you to define a key that allows any value pair. You can have maximum of 255 characters and upto 10 entries are allowed.'
        subtitles:
          type: object
          description: |
            Generates subtitle files for audio/video files.
          properties:
            languageName:
              type: string
              example: english
              description: |
                Name of the language in which the subtitles will be generated.
            metadata:
              type: object
              additionalProperties:
                type: string
                maxLength: 255
              maxProperties: 10
              example:
                key1: value1
              description: 'You can search for videos with specific key value pairs using metadata, when you tag a video in "key" : "value" pairs. Dynamic Metadata allows you to define a key that allows any value pair. You can have maximum of 255 characters and upto 10 entries are allowed.'
            languageCode:
              type: string
              example: en
              enum:
                - en
                - it
                - pl
                - es
                - fr
                - ru
                - nl
              description: |
                Language codes are concise, standardized symbols that denote languages, utilizing either two or three characters for identification. The language code must be compliant with the BCP 47 standard to ensure compatibility. (for text only).
        accessPolicy:
          type: string
          example: public
          enum:
            - public
            - private
            - drm
          description: |
            Determines whether access to the streamed content is kept private or available to all.
        mp4Support:
          type: string
          example: capped_4k
          enum:
            - capped_4k
            - audioOnly
            - audioOnly,capped_4k
          description: |
            "capped_4k": Generates an mp4 video file up to 4k resolution "audioOnly": Generates an m4a audio file of the media file "audioOnly,capped_4k": Generates both video and audio media files for offline viewing
        sourceAccess:
          type: boolean
          example: true
          description: The sourceAccess parameter determines whether the original media file is accessible. Set to true to enable access or false to restrict it
        optimizeAudio:
          type: boolean
          default: false
          example: true
          description: |
            normalize volume of the audio track. This is available for pre-recorded content only.
        maxResolution:
          type: string
          example: 1080p
          default: 1080p
          enum:
            - 2160p
            - 1440p
            - 1080p
            - 720p
            - 480p
            - 360p
          description: |
            The maximum resolution tier determines the highest quality your media will be available in.
        summary:
          type: object
          properties:
            generate:
              type: boolean
              example: true
              description: |
                Enable or disable the summary feature for the media. Set to true to enable summary or false to disable.
            summaryLength:
              type: integer
              example: 100
              default: 100
              maximum: 250
              minimum: 30
              description: |
                Specifies the desired word count for the generated summary. 
                - The value must be between **30** and **250** words.
          required:
            - generate
        chapters:
          type: boolean
          example: true
          description: |
            Enable or disable the chapters feature for the media. Set to `true` to enable chapters or `false` to disable.
        namedEntities:
          type: boolean
          example: true
          description: |
            Enable or disable named entity extraction. Set to `true` to enable or `false` to disable.
        moderation:
          type: object
          properties:
            type:
              $ref: "#/components/schemas/MediaType"
              description: |
                Defines the type of input. Possible values include video, audio, av.
          required:
            - type
        accessRestrictions:
          type: object
          properties:
            domains:
              type: object
              properties:
                defaultPolicy:
                  $ref: "#/components/schemas/PolicyAction"
                allow:
                  type: array
                  items:
                    type: string
                  description: |
                    A list of domain names or patterns that are explicitly allowed access. 
                    This list is only effective when the `defaultPolicy` is set to `deny`.
                deny:
                  type: array
                  items:
                    type: string
                  description: |
                    A list of domain names or patterns that are explicitly denied access. 
                    This list is only effective when the `defaultPolicy` is set to `allow`.
            userAgents:
              type: object
              properties:
                defaultPolicy:
                  $ref: "#/components/schemas/PolicyAction"
                allow:
                  type: array
                  items:
                    type: string
                  description: |
                    A list of user agents (identified by string names or patterns) that are explicitly allowed access. 
                    This list is only effective when the `defaultPolicy` is set to `deny`.
                deny:
                  type: array
                  items:
                    type: string
                  description: |
                    A list of user agents (identified by string names or patterns) that are explicitly denied access. 
                    This list is only effective when the `defaultPolicy` is set to `allow`.
      example:
        inputs:
          - type: video
            url: https://static.fastpix.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4
            startTime: 0
            endTime: 60
          - type: watermark
            url: https://static.fastpix.com/watermark-4k.png
            placement:
              xAlign: left
              xMargin: 10%
              yAlign: top
              yMargin: 10%
        metadata:
          key1: value1
        subtitles:
          languageName: name
          metadata:
            key1: value1
          languageCode: en
        accessPolicy: public
        mp4Support: capped_4k
        optimizeAudio: true
        maxResolution: 1080p
    VideoInput:
      required:
        - url
        - type
      properties:
        type:
          type: string
          example: video
          description: |
            Defines the type of input.
        url:
          type: string
          example: https://static.fastpix.com/sample.mp4
          description: |
            The url hosts the media file for FastPix, which needs to be downloaded to use further. It supports formats like MP3, MP4, MOV, MKV, or TS, and includes text tracks for subtitles/CC (SRT file/VTT file). While FastPix can handle various audio and video formats and codecs, using standard inputs can help with optimal processing speed.
        startTime:
          type: number
          example: "0"
          description: |
            Start time indicates where encoding should begin within the video file. For example, if you want to encode a segment from 3 minutes (180 seconds) to 6 minutes (360 seconds) in a 10-minute (600 seconds) video, the start time is 3 minutes (180 seconds). Note: Start time is always mentioned in seconds.
        endTime:
          type: number
          example: "60"
          description: |
            End time indicates where encoding should end within the video file. For example, if you want to encode a segment from 3 minutes (180 seconds) to 6 minutes (360 seconds) in a 10-minute (600 seconds) video, the end time is 6 minutes (360 seconds). Note: End time is always mentioned in seconds.
        introUrl:
          type: string
          example: https://static.fastpix.com/sample.mp4
          description: |
            The url of the intro video which is to be added at the start of the video.
        outroUrl:
          type: string
          example: https://static.fastpix.com/sample.mp4
          description: |
            The url of the outro video which is to be added at the end of the video.
        expungeSegments:
          type: array
          description: |
            The list of the startTime-endTime of the segments to be removed from the actual video.
          items:
            type: string
            example: 4-6
          example:
            - 4-6
            - 15-19
        segments:
          type: array
          description: A list of media segments to be added or processed. Each segment includes details such as the URL of the media file and instructions on where it should be inserted in the final media composition. A segment can either specify an exact timestamp  (`insertAt`) or indicate that it should be added at the end (`insertAtEnd`).
          items:
            type: object
            oneOf:
              - type: object
                required:
                  - url
                  - insertAt
                properties:
                  url:
                    type: string
                    format: uri
                    description: URL of the segment to be added.
                    example: https://storage.googleapis.com/gtv-videos-mp4
                  insertAt:
                    type: integer
                    description: The timestamp at which the segment should be inserted.
                    example: 2
              - type: object
                required:
                  - url
                  - insertAtEnd
                properties:
                  url:
                    type: string
                    format: uri
                    description: URL of the segment to be added.
                    example: https://storage.googleapis.com/gtv-videos-mp4
                  insertAtEnd:
                    type: boolean
                    description: Flag indicating the segment should be inserted at the end.
                    example: true
    WatermarkInput:
      type: object
      properties:
        type:
