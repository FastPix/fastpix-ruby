components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |
        - Username : Access token id
        - Password : Secret key
  schemas:
    # Common enums
    SortOrder:
      type: string
      enum:
        - asc
        - desc
      default: desc
      example: desc
      description: "The values in the list can be arranged in two ways: DESC (Descending) or ASC (Ascending)."
    
    PlaylistOrder:
      type: string
      enum:
        - createdDate ASC
        - createdDate DESC
      description: Determines the insertion order of media into playlist.
    
    DateRange:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
      description: Date range with start and end dates.
    
    FieldError:
      type: object
      properties:
        field:
          type: string
          example: fieldName
          description: Displays the specific field associated with the error.
        message:
          type: string
          example: must not be null
          description: Error message for the field
      required:
        - field
        - message
    
    BooleanEnum:
      type: string
      enum:
        - "true"
        - "false"
      description: Boolean value as string
    
    MediaType:
      type: string
      enum:
        - video
        - audio
        - av
      description: Type of media content
    
    AccessPolicy:
      type: string
      enum:
        - public
        - private
        - drm
      description: Access policy for media content
    
    BasicAccessPolicy:
      type: string
      enum:
        - public
        - private
      description: Basic access policy for media content
    
    PolicyAction:
      type: string
      enum:
        - allow
        - deny
      description: Policy action type
    
    # Reusable access restriction schemas
    DomainRestrictions:
      type: object
      description: Restrictions based on the originating domain of a request
      properties:
        defaultPolicy:
          $ref: "#/components/schemas/PolicyAction"
        allow:
          type: array
          items:
            type: string
          description: A list of domain names or patterns that are explicitly allowed access
        deny:
          type: array
          items:
            type: string
          description: A list of domain names or patterns that are explicitly denied access
    
    UserAgentRestrictions:
      type: object
      description: Restrictions based on the user agent
      properties:
        defaultPolicy:
          $ref: "#/components/schemas/PolicyAction"
        allow:
          type: array
          items:
            type: string
          description: A list of user agents that are explicitly allowed access
        deny:
          type: array
          items:
            type: string
          description: A list of user agents that are explicitly denied access
    
    SrtPlaybackResponse:
      type: object
      description: This object contains the livestream playback response details for SRT Protocol
      properties:
        srtPlaybackStreamId:
          type: string
          description: A unique identifier for the SRT playback stream. This ID is used to distinguish between different playback streams
        srtPlaybackSecret:
          type: string
          description: A playback secret used for securing the SRT playback stream. This ensures that only authorized users can access the playback
    
    # Common objects
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Demonstrates whether the request is successful or not.
        data:
          type: array
          items:
            type: object
          description: Array of response data
      required:
        - success
        - data
    
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: Field name that caused the error
        message:
          type: string
          description: Error message for the field
      required:
        - field
        - message
    
    ValidationError:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        message:
          type: string
          description: Error message
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: List of field-specific errors
      required:
        - code
        - message
        - fields
    
    LanguageCode:
      type: string
      enum:
        - ar-SA
        - bn-BD
        - bn-IN
        - ca-ES
        - cs-CZ
        - da-DK
        - de-AT
        - de-CH
        - de-DE
        - el-GR
        - en-AU
        - en-CA
        - en-GB
        - en-IE
        - en-IN
        - en-NZ
        - en-US
        - en-ZA
        - es-AR
        - es-CL
        - es-CO
        - es-ES
        - es-MX
        - es-US
        - fi-FI
        - fr-BE
        - fr-CA
        - fr-CH
        - fr-FR
        - he-IL
        - hi-IN
        - hr-HR
        - hu-HU
        - id-ID
        - it-CH
        - it-IT
        - ja-JP
        - ko-KR
        - ms-MY
        - nb-NO
        - nl-BE
        - nl-NL
        - no-NO
