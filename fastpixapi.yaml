                          description: Contains metadata and structural details about the media file, including its container format and individual tracks.
                          properties:
                            containerFormat:
                              type: string
                              example: mp4
                              description: Holds different types of multimedia data in a single file.
                            tracks:
                              type: array
                              description: Represents the individual tracks within the media, such as video, audio, and subtitle.
                              items:
                                $ref: "#/components/schemas/Track"
                example:
                  success: true
                  data:
