paths:
  /on-demand:
    post:
      security:
        - BasicAuth: []
      tags:
        - Input video
      summary: Create media from URL
      description: |
        This endpoint allows developers or users to create a new video or audio media in FastPix using a publicly accessible URL. FastPix will fetch the media from the provided URL, process it, and store it on the platform for use. 



        #### Public URL requirement:


          The provided URL must be publicly accessible and should point to a video stored in one of the following supported formats: .m4v, .ogv, .mpeg, .mov, .3gp, .f4v, .rm, .ts, .wtv, .avi, .mp4, .wmv, .webm, .mts, .vob, .mxf, asf, m2ts 



        #### Supported storage types:

        The URL can originate from various cloud storage services or content delivery networks (CDNs) such as: 


        * **Amazon S3:** URLs from Amazon's Simple Storage Service. 

        * **Google Cloud Storage:** URLs from Google Cloud's storage solution. 

        * **Azure Blob Storage:** URLs from Microsoft's Azure storage. 

        * **Public CDNs:** URLs from public content delivery networks that host video files. 

        Upon successful creation, the API returns an `id` that should be retained for future operations related to this media. 

        #### How it works


        1. Send a POST request to this endpoint with the media URL (typically a video or audio file) and optional media settings. 

        2. FastPix uploads the video from the provided URL to its storage. 

        3. Receive a response containing the unique id for the newly created media item. 

        4. Use the id in subsequent API calls, such as checking the status of the media with the <a href="https://fastpix.com/docs/video-on-demand-api/manage-videos/get-media">Get Media by ID</a> endpoint to determine when the media is ready for playback. 

        FastPix uses webhooks to tell your application about things that happen in the background, outside of the API regular request flow. For instance, once the media file is created (but not yet processed or encoded), we'll shoot a `POST` message to the address you give us with the webhook event <a href="https://fastpix.com/docs/vod-events/media-events#videomediacreated">video.media.created</a>. 


        Once processing is done you can look for the events <a href="https://fastpix.com/docs/vod-events/media-events#/videomediaready">video.media.ready<a/> and <a href="https://fastpix.com/docs/vod-events/media-events#videomediafailed">video.media.failed</a> to see the status of your new media file.

        Related guide: <a href="https://fastpix.com/docs/upload-videos/upload-videos-from-a-url">Upload videos from URL</a>
      operationId: create-media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaRequest"
            example:
              inputs:
                - type: video
                  url: https://static.fastpix.com/sample.mp4
              metadata:
                key1: value1
              accessPolicy: public
              maxResolution: 1080p
        description: Request body for uploading a video media from URL
      responses:
        "201":
          description: Media is created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMediaSuccessResponse"
                example:
                  success: true
                  data:
                    id: ffc4e8dd-544c-4ade-bdf1-ac31cb4e6b8f
                    trial: false
                    status: Created
                    createdAt: "2025-01-09T06:39:13.759544Z"
                    updatedAt: "2025-01-09T06:39:13.759588Z"
                    playbackIds:
                      - id: df5be71b-96dc-4edd-bdba-dcc43ab60309
                        accessPolicy: public
                        accessRestrictions:
                          domains:
                            defaultPolicy: allow
                            allow: []
                            deny: []
                          userAgents:
                            defaultPolicy: allow
                            allow: []
                            deny: []
                    metadata:
                      key1: value1
                    sourceAccess: false
                    maxResolution: 1080p
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPermission"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "422":
          description: Payload Validation Failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    get:
      security:
        - BasicAuth: []
      tags:
        - Manage videos
      summary: Get list of all media
      description: |
        This endpoint returns a list of all media files uploaded to FastPix within a specific workspace. Each media entry contains data such as the media `id`, `createdAt`, `status`, `type` and more. It allows you to retrieve an overview of your media assets, making it easier to manage and review them. 


        #### How it works

        Use the access token and secret key related to the workspace in the request header. When called, the API provides a paginated response containing all the media items in that specific workspace. This is helpful for retrieving a large volume of media and managing content in bulk. 



        #### Example
        You're managing a video platform and need to check all the uploaded media in your library to ensure no outdated or low-quality content is being served. Using this endpoint, you can retrieve a complete list of media, allowing you to filter, sort, or update items as needed.
      operationId: list-media
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
            example: 20
          description: Limit specifies the maximum number of items to display per page.
        - in: query
          name: offset
          schema:
            type: integer
            default: 1
            example: 1
          description: Offset determines the starting point for data retrieval within a paginated list.
        - in: query
          name: orderBy
          schema:
            type: string
            example: desc
            default: desc
            $ref: '#/components/schemas/SortOrder'
      responses:
        "200":
          description: List of video media
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Demonstrates whether the request is successful or not.
                  data:
                    description: Displays the result of the request.
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                example:
                  success: true
                  data:
                    - thumbnail: https://images.fastpix.com/837f028b-dcaf-4c23-b368-3748641f74ac/thumbnail.png
                      id: cfeec1a3-6cbd-40df-a425-2ed7f8f72ced
                      workspaceId: 6dc2b4e0-0615-42fd-a580-1f4aad932dfe
                      metadata:
                        key1: value1
                      maxResolution: 1080p
                      sourceResolution: 1080p
                      status: Ready
                      sourceAccess: false
                      playbackIds:
                        - id: 837f028b-dcaf-4c23-b368-3748641f74ac
                          accessPolicy: public
                          accessRestrictions:
                            domains:
                              defaultPolicy: allow
                              allow: []
                              deny: []
                            userAgents:
                              defaultPolicy: allow
                              allow: []
                              deny: []
                      tracks:
                        - id: f301a2a1-b40d-40fa-b419-4d0cd92a62f8
                          type: video
                          width: 1920
                          height: 1080
                          frameRate: 30/1
                          status: Ready
                          closedCaptions: false
                      isAudioOnly: false
                      subtitleAvailable: true
                      duration: "00:00:10"
                      frameRate: 30/1
                      aspectRatio: "16:9"
                      createdAt: "2025-01-09T06:44:44.617138Z"
                      updatedAt: "2025-01-09T06:44:53.742648Z"
                  pagination:
                    totalRecords: 100
                    currentOffset: 1
                    offsetCount: 10
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPermission"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "422":
          description: Get video media payload validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
  /on-demand/{livestreamId}/live-clips:
    get:
      security:
        - BasicAuth: []
      tags:
        - Manage videos
      summary: Get all clips of a live stream
      description: |
        Retrieves a list of all media clips generated from a specific livestream. Each media entry includes metadata such as the clip media IDs, and other relevant details. A media clip is a segmented portion of an original media file (source live stream). Clips are often created for various purposes such as previews, highlights, or customized edits.
        #### How it works
        To use this endpoint, provide the `livestreamId` as a parameter. The API then returns a paginated list of clipped media items created from that livestream. Pagination ensures optimal performance and usability when dealing with a large number of media files, making it easier to organize and manage content in bulk.

        Related guide: <a href="https://fastpix.com/docs/edit-and-transform-live-stream/clip-moments-from-a-live-stream">Instant live clipping</a>
      operationId: list-live-clips
      parameters:
        - in: path
          name: livestreamId
          required: true
          schema:
            type: string
            format: uuid
            example: b6f71268143f70c798a7851a0a92dcbf
          description: The stream Id is unique identifier assigned to the live stream.
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
            example: 20
          description: Limit specifies the maximum number of items to display per page.
        - in: query
          name: offset
          schema:
            type: integer
            default: 1
            example: 1
          description: Offset determines the starting point for data retrieval within a paginated list.
        - in: query
          name: orderBy
          schema:
            type: string
            example: desc
            default: desc
            $ref: '#/components/schemas/SortOrder'
      responses:
        "200":
          description: List of video media
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Demonstrates whether the request is successful or not.
                  data:
                    description: Displays the result of the request.
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                example:
                  success: true
                  data:
                    - thumbnail: https://images.fastpix.com/837f028b-dcaf-4c23-b368-3748641f74ac/thumbnail.png
                      id: cfeec1a3-6cbd-40df-a425-2ed7f8f72ced
                      workspaceId: 6dc2b4e0-0615-42fd-a580-1f4aad932dfe
                      metadata:
                        key1: value1
                      maxResolution: 1080p
                      sourceResolution: 1080p
                      status: Ready
                      sourceAccess: false
                      playbackIds:
                        - id: 837f028b-dcaf-4c23-b368-3748641f74ac
                          accessPolicy: public
                          accessRestrictions:
                            domains:
                              defaultPolicy: allow
                              allow: []
                              deny: []
                            userAgents:
                              defaultPolicy: allow
                              allow: []
                              deny: []
                      tracks:
                        - id: f301a2a1-b40d-40fa-b419-4d0cd92a62f8
                          type: video
                          width: 1920
                          height: 1080
                          frameRate: 30/1
                          status: Ready
                          closedCaptions: false
                      isAudioOnly: false
                      subtitleAvailable: true
                      duration: "00:00:10"
                      frameRate: 30/1
                      aspectRatio: "16:9"
                      createdAt: "2025-01-09T06:44:44.617138Z"
                      updatedAt: "2025-01-09T06:44:53.742648Z"
                  pagination:
                    totalRecords: 100
                    currentOffset: 1
                    offsetCount: 10
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPermission"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "422":
          description: Get video media payload validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
  /on-demand/{mediaId}:
    get:
      security:
        - BasicAuth: []
      tags:
        - Manage videos
      summary: Get a media by ID
      description: |
        By calling this endpoint, you can retrieve detailed information about a specific media item, including its current `status` and a `playbackId`. This is particularly useful for retrieving specific media details when managing large content libraries. 



        #### How it works 



        1. Make a GET request to this endpoint, using the `<mediaId>` received after uploading the media file. 


        2. Receive a response that includes details about the media: 

        * `status` Indicates whether the media is still `preparing` or has transitioned to `ready`.  

        * The `playbackId` is a unique identifier that allows you to stream the media once it is `ready`. You can construct the stream URL in this format: `https://stream.fastpix.com/<playbackId>.m3u8`


        #### Example

        Suppose your platform provides users with an interface where they can manage their uploaded content. A user requests detailed information about a specific video to see if it has been fully processed and is available for playback. Using the media ID, you can fetch the information from FastPix and display it in the user's dashboard.
      operationId: get-media
      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: string
            format: uuid
            example: 4fa85f64-5717-4562-b3fc-2c963f66afa6
          description: The Media Id is assigned a universal unique identifier, which can contain a maximum of 255 characters.
      responses:
        "200":
          description: Get a video media by id
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Demonstrates whether the request is successful or not.
                  data:
                    $ref: "#/components/schemas/Media"
                example:
                  success: true
                  data:
                    thumbnail: https://images.fastpix.com/837f028b-dcaf-4c23-b368-3748641f74ac/thumbnail.png
                    id: cfeec1a3-6cbd-40df-a425-2ed7f8f72ced
                    workspaceId: 6dc2b4e0-0615-42fd-a580-1f4aad932dfe
                    metadata:
                      key1: value1
                    maxResolution: 1080p
                    sourceResolution: 1080p
                    status: Ready
                    sourceAccess: false
                    playbackIds:
                      - id: 837f028b-dcaf-4c23-b368-3748641f74ac
                        accessPolicy: public
                        accessRestrictions:
                          domains:
                            defaultPolicy: allow
                            allow: []
                            deny: []
                          userAgents:
                            defaultPolicy: allow
                            allow: []
                            deny: []
                    tracks:
                      - id: f301a2a1-b40d-40fa-b419-4d0cd92a62f8
                        type: video
                        width: 1920
                        height: 1080
                        frameRate: 30/1
                        closedCaptions: false
                    isAudioOnly: false
                    subtitleAvailable: true
                    duration: "00:00:10"
                    frameRate: 30/1
                    aspectRatio: "16:9"
                    createdAt: "2025-01-09T06:44:44.617138Z"
                    updatedAt: "2025-01-09T06:44:53.742648Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPermission"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "404":
          description: media workspace relation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaNotFound"
        "422":
          description: Payload Validation Failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    patch:
      security:
        - BasicAuth: []
      tags:
        - Manage videos
      summary: Update a media by ID
      description: |
        This endpoint allows you to update specific parameters of an existing media file. You can modify the key-value pairs of the metadata that were provided in the payload during the creation of media from a URL or when uploading the media directly from device. 


        #### How it works

        1. Make a PATCH request to this endpoint, replacing `<mediaId>` with the unique ID (`uploadId` or `id`) of the media received after uploading to FastPix. 

        2. Include the updated parameters in the request body. 

        3. Receive a response containing the updated media data, confirming the changes made. 

        Once you have made the update request, you can also look for the webhook event <a href="https://fastpix.com/docs/vod-events/media-events#videomediaupdated">video.media.updated</a> to notify your system about update status. 

        #### Example
        Imagine a scenario where a user uploads a video and later realizes they need to change the title, add a new description or tags. You can use this endpoint to update the media metadata without having to re-upload the entire video.
      operationId: updated-media
      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: string
            format: uuid
            example: 4fa85f64-5717-4562-b3fc-2c963f66afa6
          description: When creating the media, FastPix assigns a universally unique identifier with a maximum length of 255 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 255
                  maxProperties: 10
                  example:
                    metadata:
                      user: fastpix_admin
      responses:
        "200":
          description: Media details updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Demonstrates whether the request is successful or not.
                  data:
                    $ref: "#/components/schemas/Media"
                example:
                  success: true
                  data:
                    thumbnail: https://images.fastpix.com/837f028b-dcaf-4c23-b368-3748641f74ac/thumbnail.png
                    id: cfeec1a3-6cbd-40df-a425-2ed7f8f72ced
                    workspaceId: 6dc2b4e0-0615-42fd-a580-1f4aad932dfe
                    metadata:
                      user: fastpix_admin
                    maxResolution: 1080p
                    sourceResolution: 1080p
                    status: Ready
                    sourceAccess: false
                    playbackIds:
                      - id: 837f028b-dcaf-4c23-b368-3748641f74ac
                        accessPolicy: public
                        accessRestrictions:
                          domains:
                            defaultPolicy: allow
                            allow: []
                            deny: []
                          userAgents:
                            defaultPolicy: allow
                            allow: []
                            deny: []
                    tracks:
                      - id: f301a2a1-b40d-40fa-b419-4d0cd92a62f8
                        type: video
                        width: 1920
                        height: 1080
                        frameRate: 30/1
                        closedCaptions: false
                    isAudioOnly: false
                    subtitleAvailable: true
                    duration: "00:00:10"
                    frameRate: 30/1
                    aspectRatio: "16:9"
                    createdAt: "2025-01-09T06:44:44.617138Z"
                    updatedAt: "2025-01-09T06:44:53.742648Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPermission"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "404":
          description: media workspace relation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaNotFound"
        "422":
          description: Payload Validation Failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      security:
        - BasicAuth: []
      tags:
        - Manage videos
      summary: Delete a media by ID
      operationId: delete-media
      description: |
        This endpoint allows you to permanently delete a a specific video or audio media file along with all associated data. If you wish to remove a media from FastPix storage, use this endpoint with the `mediaId` (either `uploadId` or `id`) received during the media's creation or upload. 


        #### How it works


        1. Make a DELETE request to this endpoint, replacing `<mediaId>` with the `uploadId` or the `id` of the media you want to delete. 

        2. Since this action is irreversible, ensure that you no longer need the media before proceeding. Once deleted, the media cannot be retrieved or played back. 

        3. Webhook event to look for: <a href="https://fastpix.com/docs/vod-events/media-events#videomediadeleted">video.media.deleted</a>

        #### Example
        A user on a video-sharing platform decides to remove an old video from their profile, or suppose you're running a content moderation system, and one of the videos uploaded by a user violates your platform's policies. Using this endpoint, the media is permanently deleted from your library, ensuring it's no longer accessible or viewable by other users.
      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: string
            format: uuid
            example: 4fa85f64-5717-4562-b3fc-2c963f66afa6
          description: When creating the media, FastPix assigns a universally unique identifier with a maximum length of 255 characters.
      responses:
        "200":
          description: Delete a video media
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    description: Demonstrates whether the request is successful or not.
                example:
                  success: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidPermission"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden"
        "404":
          description: media workspace relation not found
          content:
            application/json:
