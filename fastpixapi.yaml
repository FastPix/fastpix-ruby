  /live/streams:
    post:
      security:
        - BasicAuth: []
      tags:
        - Start live stream
      summary: Create a new stream
      description: |-
        Allows you to initiate a new <a href="https://fastpix.com/docs/get-started/live-overview">RTMPS</a> or <a href="https://fastpix.com/docs/broadcast/live-stream-with-srt">SRT</a> live stream on FastPix. Upon creating a stream, FastPix generates a unique `streamKey` and `srtSecret`, which can be used with any broadcasting software (like OBS) to connect to FastPix's RTMPS or SRT servers.
        Leverage SRT for live streaming in environments with unstable networks, taking advantage of its error correction and encryption features for a resilient and secure broadcast. 

        <h4>How it works</h4> 

        1. Send a a `POST` request to this endpoint. You can configure the stream settings, including `metadata` (such as stream name and description), `reconnectWindow` (in case of disconnection), and privacy options (`public` or `private`). 

        2. FastPix returns the stream details for both RTMPS and SRT configurations. These keys and IDs from the stream details are essential for connecting the broadcasting software to FastPix’s servers and transmitting the live stream to viewers.

        3. Once the live stream is created, we’ll shoot a `POST` message to the address you give us with the webhook event <a href="https://fastpix.com/docs/live-stream-events/live-events#videolive_streamcreated">video.live_stream.created</a>.


        **Example:**


          Imagine a gaming platform that allows users to live stream gameplay directly from their dashboard. The API creates a new stream, provides the necessary stream key, and sets it to "private" so that only specific viewers can access it. 
        
        
        Related guide: <a href="https://fastpix.com/docs/get-started/live-quickstart">How to live stream</a>
      operationId: create-new-stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLiveStreamRequest'
      responses:
        '201':
          description: Stream created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/liveStreamResponseDTO'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidPermission'
        '422':
          description: Payload Validation Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    get:
      security:
        - BasicAuth: []
      tags:
        - Manage live stream
      summary: Get all live streams
      description: |-
        Retrieves a list of all live streams associated with the current workspace. It provides an overview of both current and past live streams, including details like `streamId`, `metadata`, `status`, `createdAt` and more.
        
        
        #### How it works

        Use the access token and secret key related to the workspace in the request header. When called, the API provides a paginated response containing all the live streams in that specific workspace. This is helpful for retrieving a large volume of streams and managing content in bulk.
      operationId: get-all-streams
      parameters:
        - name: limit
          in: query
          description: Limit specifies the maximum number of items to display per page.
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
            example: 20
        - name: offset
          in: query
          description: Offset determines the starting point for data retrieval within a paginated list.
          schema:
            type: integer
            default: 1
            example: 1
        - name: orderBy
          in: query
          description: The list of value can be order in two ways DESC (Descending) or ASC (Ascending). In case not specified, by default it will be DESC.
          schema:
            type: string
            example: desc
            default: desc
