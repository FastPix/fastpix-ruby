  /on-demand/upload:
    post:
      security:
        - BasicAuth: []
      tags:
        - Input video
      summary: Upload media from device
      operationId: direct-upload-video-media
      description: |
        This endpoint enables accelerated uploads of large media files directly from your local device to FastPix for processing and storage.

        > **PLEASE NOTE**
        >
        > This version now supports uploads with no file size limitations and offers faster uploads. The previous endpoint (which had a 500MB size limit) is now deprecated. You can find details in the [changelog](https://fastpix.com/docs/changelog/release-notes).

        #### How it works

        1. Send a POST request to this endpoint with optional media settings.  

        2. The response includes an `uploadId` and a signed `url` for direct video file upload.

        3. Upload your video file to the provided `url` by making `PUT` request. The API accepts the media file from the device and uploads it to the FastPix platform. 

        4. Once uploaded, the media undergoes processing and is assigned a unique ID for tracking. Retain this `uploadId` for any future operations related to this upload. 




        After uploading, you can use the <a href="https://fastpix.com/docs/video-on-demand-api/manage-videos/get-media">Get Media by ID</a> endpoint to check the status of the uploaded media asset and see if it has transitioned to a `ready` status for playback. 

        To notify your application about the status of this API request check for the webhooks for <a href="https://fastpix.com/docs/webhooks/webhook-event-reference#media-related-events">media related events</a>.  


        #### Example

        A social media platform allows users to upload video content directly from their phones or computers. This endpoint facilitates the upload process. For example, if you are developing a video-sharing app where users can upload short clips from their mobile devices, this endpoint enables them to select a video, upload it to the platform.

        Related guide: <a href="https://fastpix.com/docs/upload-videos/upload-videos-from-device">Upload videos directly</a>
      requestBody:
        description: Request body for direct upload
        content:
          application/json:
            schema:
              type: object
              required:
                - corsOrigin
              properties:
                corsOrigin:
                  type: string
                  example: "*"
                  description: Upload media directly from a device using the URL name or enter '*' to allow all.
                pushMediaSettings:
                  title: Push Media Settings
                  type: object
                  required:
                    - accessPolicy
                  description: Configuration settings for media upload.
                  properties:
                    accessPolicy:
                      $ref: "#/components/schemas/BasicAccessPolicy"
                    startTime:
                      type: number
                      example: "0"
                      description: Start time indicates where encoding should begin within the video file, in seconds.
                    endTime:
                      type: number
                      example: "60"
                      description: End time indicates where encoding should end within the video file, in seconds.
                    inputs:
                      type: array
                      items:
                        anyOf:
                          - $ref: "#/components/schemas/VideoInput"
                          - $ref: "#/components/schemas/WatermarkInput"
                          - $ref: "#/components/schemas/AudioInput"
                          - $ref: "#/components/schemas/SubtitleInput"
                    metadata:
                      type: object
                      additionalProperties:
                        type: string
                        maxLength: 255
                      maxProperties: 10
                      example:
                        key1: value1
                      description: 'Tag a video in "key" : "value" pairs for searchable metadata. Maximum 10 entries, 255 characters each.'
                    subtitles:
                      type: object
                      description: |
                        Generates subtitle files for audio/video files.
                      properties:
                        languageName:
                          type: string
                          example: english
                          description: Name of the language for the subtitles.
                        metadata:
                          type: object
                          additionalProperties:
                            type: string
                            maxLength: 255
                          maxProperties: 10
                          example:
                            key1: value1
                          description: 'Tag a video in "key" : "value" pairs for searchable metadata. Maximum 10 entries, 255 characters each.'
                        languageCode:
                          type: string
                          example: en
                          enum:
                            - en
                            - it
                            - pl
                            - es
                            - fr
                            - ru
                            - nl
                          description: |
                            Language codes (BCP 47 compliant) used for text files.
                    optimizeAudio:
                      type: boolean
                      default: true
                      example: true
                      description: |
                        Enhance the quality and volume of the audio track. This is available for pre-recorded content only.
                    maxResolution:
                      type: string
                      example: 1080p
                      default: 1080p
                      enum:
                        - 2160p
                        - 1440p
                        - 1080p
                        - 720p
                        - 480p
                        - 360p
                      description: |
                        Determines the highest quality resolution available.
                    sourceAccess:
                      type: boolean
                      example: true
                      description: The sourceAccess parameter determines whether the original media file is accessible. Set to true to enable access or false to restrict it
                    mp4Support:
                      type: string
                      example: capped_4k
                      enum:
                        - capped_4k
                        - audioOnly
                        - audioOnly,capped_4k
                      description: |
                        Generates MP4 video up to 4K ("capped_4k"), m4a audio only ("audioOnly"), or both for offline viewing.
                    summary:
                      type: object
                      properties:
                        generate:
                          type: boolean
                          example: true
                          description: |
                            Enable or disable the summary feature for the media. Set to true to enable summary or false to disable.
                        summaryLength:
                          type: integer
                          example: 100
                          default: 100
                          maximum: 250
                          minimum: 30
                          description: |
                            Specifies the desired word count for the generated summary. 
                            - The value must be between **30** and **250** words.
                    chapters:
                      type: boolean
                      example: true
                      description: |
                        Enable or disable the chapters feature for the media. Set to `true` to enable chapters or `false` to disable.
                    namedEntities:
                      type: boolean
                      example: true
                      description: |
                        Enable or disable named entity extraction. Set to `true` to enable or `false` to disable.
                    moderation:
                      type: object
                      properties:
                        type:
                          $ref: "#/components/schemas/MediaType"
                          description: |
                            Defines the type of input. Possible values include video, audio, av.
                    accessRestrictions:
                      type: object
                      properties:
                        domains:
                          $ref: "#/components/schemas/DomainRestrictions"
                        userAgents:
                          $ref: "#/components/schemas/UserAgentRestrictions"
              example:
                corsOrigin: "*"
                pushMediaSettings:
                  metadata:
                    key1: value1
                  accessPolicy: public
                  maxResolution: 1080p
