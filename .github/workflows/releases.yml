name: Release RubyGem

on:
  push:
    tags:
      - 'v*'   # Only runs on version tags like v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: false  # Disabled to allow lockfile updates

    - name: Install dependencies
      run: bundle install --jobs 4 --retry 3

    - name: Show updated Gemfile.lock (for debugging)
      if: failure()
      run: cat Gemfile.lock

    - name: Build the gem
      run: gem build ./*.gemspec

    - name: Push to RubyGems
      env:
        RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      run: |
        mkdir -p ~/.gem
        echo -e "---\n:rubygems_api_key: $RUBYGEMS_API_KEY" > ~/.gem/credentials
        chmod 0600 ~/.gem/credentials
        # Push only the newly built gem (most recent by timestamp)
        gem push $(ls -t fastpixapi-*.gem | head -1)
